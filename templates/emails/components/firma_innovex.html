<!-- Firma Institucional Innovex -->
<table style="margin-top: 36px; border-top: 1px solid #e2e8f0; width: 100%; max-width: 620px; border-collapse: collapse;">
    <tr>
        <td style="padding-top: 24px; padding-bottom: 12px; padding-right: 26px; border-right: 2px solid #e2e8f0; width: 190px; text-align: left; vertical-align: middle;">
            <div style="font-size: 26px; font-weight: 800; color: #f59e0b; line-height: 1.1; font-family: 'Segoe UI', Arial, sans-serif;">
                in<span style="color: #0f172a;">novex</span><sup style="font-size: 11px; color: #0284c7;">&reg;</sup>
            </div>
            <div style="font-size: 8.5px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; margin-top: 4px; font-family: 'Segoe UI', Arial, sans-serif;">
                SOLUCIONES TECNOLÓGICAS
            </div>
        </td>
        <td style="padding-top: 24px; padding-bottom: 12px; padding-left: 26px; color: #334155; font-size: 13.5px; vertical-align: middle; font-family: 'Segoe UI', Arial, sans-serif;">
            <strong style="font-size: 15px; text-transform: uppercase; color: #0f172a; display: block; margin-bottom: 3px; letter-spacing: 0.2px;">
                {{ personal.nombre }}
            </strong>
            <span style="font-size: 11.5px; color: #64748b; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 5px;">
                {{ personal.cargo_calculado|default:personal.cargo|default:'ASISTENTE DE SOPORTE' }}
            </span>
            <span style="font-size: 13px; color: #334155;">
                📞 {{ personal.telefono|default:'(+56) 9 841 948 43' }} | <a href="mailto:soporte@innovex.cl" style="color: #0284c7; text-decoration: none;">soporte@innovex.cl</a>
            </span>
        </td>
    </tr>
</table>
