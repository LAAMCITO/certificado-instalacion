[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-soporte-innovex"
version = "2.0.0"
description = "Portal Unificado y Suite de Soporte Técnico — Innovex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1",
    "django-cors-headers>=4.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "charset-normalizer>=3.0.0",
    "paramiko>=3.0.0"
]

[project.scripts]
suite-soporte = "src.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
